{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card fade-in">
        <h1>Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your Mobile Mart account</p>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="Enter username or email" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <label class="form-check">
                    <input type="checkbox" name="remember" value="1">
                    <span>Remember me</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
        </div>

        <div style="margin-top: 20px; padding: 16px; border-radius: var(--radius-md); background: var(--bg-glass); border: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-muted); text-align: center;">
            <strong>Demo accounts:</strong><br>
            Admin: <code>admin</code> / <code>admin123</code><br>
            User: <code>demo</code> / <code>demo123</code>
        </div>
    </div>
</div>
{% endblock %}
